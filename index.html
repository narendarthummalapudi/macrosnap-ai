    rel="stylesheet" />

  <!-- 
      GLOBAL BROWSER PROTECTION
      We place this directly in HTML before any Vite/JS module loads to avoid ES Module hoisting.
      Firebase Auth (and some third-party webviews) contains bugs where it checks async storage at ~2 seconds
      and executes window.close() or window.location = 'about:blank' if it mistakenly assumes the 
      active window is a defunct OAuth popup. This entirely neutralizes that fatal behavior natively!
    -->
  <script>
    (function () {
      // Protect window.close
      const originalClose = window.close;
      window.close = function () {
        console.error("🔥 BROWSER PROTECTION: Blocked fatal attempt to execute window.close()! Keeping window active.");
      };

      // Protect location.replace and location.assign from aggressive OAuth cleanup scripts
      const originalReplace = window.location.replace;
      window.location.replace = function (url) {
        if (typeof url === 'string' && (url === 'about:blank' || url.includes('about:blank'))) {
          console.error("🔥 BROWSER PROTECTION: Blocked location.replace('about:blank')!");
          return;
        }
        originalReplace.call(window.location, url);
      };

      const originalAssign = window.location.assign;
      window.location.assign = function (url) {
        if (typeof url === 'string' && (url === 'about:blank' || url.includes('about:blank'))) {
          console.error("🔥 BROWSER PROTECTION: Blocked location.assign('about:blank')!");
          return;
        }
        originalAssign.call(window.location, url);
      };
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
